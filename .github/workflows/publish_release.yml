name: Publish Harmony Flow

on:
  push:
    branches: [ main ]
    paths: docker/service_version.txt
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract semantic version number
        run: echo "semantic_version=$(cat docker/service_version.txt)" >> $GITHUB_ENV

      - name: Build Base Image
        run: ./bin/build-image ${{ env.semantic_version }}

      - name: Build Test Image
        run: ./bin/build-test ${{ env.semantic_version }}

      - name: Run Tests
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: ./bin/run-test ${{ env.semantic_version }}

  build_and_publish:
    needs: [run_tests]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract semantic version number
        run: echo "semantic_version=$(cat docker/service_version.txt)" >> $GITHUB_ENV

      - name: Log in to ghcr.io registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add tags to the Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.semantic_version }}

      - name: Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/service.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          commit: main
          name: Version ${{ env.semantic_version }}
          tag: ${{ env.semantic_version }}